version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # persist ChromaDB across restarts
      - ./config:/app/config      # read config.yaml
    environment:
      - ZENDESK_API_TOKEN=${ZENDESK_API_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
    restart: unless-stopped

  mock-zendesk:
    # Useful for local dev / CI — remove in production
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn scripts.mock_zendesk_server:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    volumes:
      - ./tests/fixtures:/app/tests/fixtures
    profiles:
      - dev     # only starts with: docker compose --profile dev up
